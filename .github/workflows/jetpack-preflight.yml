name: JERP JetPack deployment preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/jetson/**"
      - "tests/test_jetpack_preflight.py"
      - ".github/workflows/jetpack-preflight.yml"
  push:
    branches: [main]
    paths:
      - "infra/jetson/**"
      - "tests/test_jetpack_preflight.py"
      - ".github/workflows/jetpack-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test portable inventory script without installing anything
        run: |
          python -m unittest discover -s tests -v
          python -m infra.jetson.preflight --json
      - name: Clarify hardware validation boundary
        run: echo "This checks the Python preflight on x86 CI, not physical Jetson compatibility."
